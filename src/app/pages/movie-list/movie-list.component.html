<ion-header>
  <ion-toolbar>
    <ion-title>Movies List</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list>
    <ion-item *ngFor="let movie of movies">
      <ion-thumbnail slot="start">
        <img [src]="'https://image.tmdb.org/t/p/w200' + movie.poster_path" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ movie.title }}</h2>
        <p>{{ movie.release_date }}</p>
      </ion-label>
      <ion-button (click)="addToFavorites(movie.id)">Add to Favorites</ion-button>
      <ion-toast
    [isOpen]="isToastOpen"
    message="Movies added to favorites"
    [duration]="2000"
    (didDismiss)="setOpen(false)"
  ></ion-toast>
    </ion-item>
  </ion-list>
</ion-content>
