<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin"></ion-back-button>
    </ion-buttons>
    <ion-title>User Details</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        Logout
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngIf="user">
    <ion-card-header>
      <ion-card-title>{{ user.name }} {{ user.surname }}</ion-card-title>
      <ion-card-subtitle>Age: {{ user.age }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-img [src]="user.photoUrl" *ngIf="user.photoUrl"></ion-img>
      <ion-item>
        <ion-label>Email: {{ user.email }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Status: {{ user.isActive ? 'Active' : 'Inactive' }}</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-list-header>
      <ion-label>Favorite Movies</ion-label>
    </ion-list-header>
    <ion-item *ngFor="let movie of favoriteMovies">
      <ion-thumbnail slot="start">
        <img [src]="'https://image.tmdb.org/t/p/w200' + movie.poster_path" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ movie.title }}</h2>
        <p>{{ movie.release_date | date:'yyyy' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
