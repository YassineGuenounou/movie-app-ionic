<ion-header>
  <ion-toolbar>
    <ion-title>My Favorites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let movie of favoriteMovies">
      <ion-thumbnail slot="start">
        <img [src]="'https://image.tmdb.org/t/p/w200' + movie.poster_path" alt="" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ movie.title }}</h2>
        <p>{{ movie.release_date }}</p>
      </ion-label>
      <ion-button (click)="removeFromFavorites(movie.id)" color="danger">Remove</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
