<ion-app>

  <ion-tabs *ngIf="showNavbar">
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="movie-list" [routerLink]="'/movie-list'">
        <ion-icon name="home"></ion-icon>
        <ion-label>movie-list</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="favorites" [routerLink]="'/favorites'">
        <ion-icon name="settings"></ion-icon>
        <ion-label>favorites</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="matching" [routerLink]="'/matching'">
        <ion-icon name="person"></ion-icon>
        <ion-label>matching</ion-label>
      </ion-tab-button>
    </ion-tab-bar>

  </ion-tabs>
</ion-app>
